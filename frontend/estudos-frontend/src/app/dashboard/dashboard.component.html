<div class="dashboard-container">
  <!-- Sessão não iniciada -->
  <mat-card class="dashboard-card" *ngIf="!sessaoAtiva">
    <mat-card-header>
      <mat-icon class="dashboard-icon" color="primary">school</mat-icon>
      <mat-card-title>Dashboard</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p class="dashboard-desc">
        Gerencie suas sessões de estudo, acompanhe seu desempenho e veja seu histórico de aprendizado.
      </p>
    </mat-card-content>

    <mat-card-actions>
      <button mat-raised-button color="primary" class="dashboard-btn" (click)="abrirDialog()">
        <mat-icon>play_arrow</mat-icon>
        Iniciar Sessão
      </button>
    </mat-card-actions>
  </mat-card>

  <!-- Sessão ativa -->
  <mat-card class="sessao-card" *ngIf="sessaoAtiva">
    <mat-card-header>
      <mat-card-title>{{ sessaoAtiva.disciplina }}</mat-card-title>
      <mat-card-subtitle>{{ sessaoAtiva.assunto }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="circle-container">
        <svg class="progress-circle" width="180" height="180">
          <circle class="bg-circle" cx="90" cy="90" r="70"></circle>
          <circle
            class="fg-circle"
            cx="90"
            cy="90"
            r="70"
            [attr.stroke-dasharray]="440"
            [attr.stroke-dashoffset]="calcularProgressoCirc()"
          ></circle>
        </svg>

        <div class="time-text">
          <div class="tempo">{{ formatarTempo(tempoRestante) }}</div>
          <small *ngIf="pausado" class="status pausado">Pausado</small>
        </div>
      </div>
    </mat-card-content>

    <mat-card-actions>
      <button mat-stroked-button color="primary" (click)="pausarRetomar()">
        <mat-icon>{{ pausado ? 'play_arrow' : 'pause' }}</mat-icon>
        {{ pausado ? 'Retomar' : 'Pausar' }}
      </button>

      <button mat-stroked-button color="warn" (click)="encerrarSessao()">
        <mat-icon>stop</mat-icon>
        Encerrar
      </button>
    </mat-card-actions>
  </mat-card>

  <!-- Histórico -->
  <section class="historico-section">
    <app-historico [historico]="historicoLocal"></app-historico>
  </section>
</div>
